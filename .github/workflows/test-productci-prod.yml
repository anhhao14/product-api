name: Test Product CI (Prod)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v5

      - name: Khởi động MongoDB + API và chờ healthcheck
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Trạng thái container
        run: docker compose ps

      - name: Test CRUD (kiểm tra mã trạng thái)
        run: bash scripts/smoke-test.sh

      - name: In log khi lỗi
        if: failure()
        run: docker compose logs

      - name: Dọn dẹp
        if: always()
        run: docker compose down -v