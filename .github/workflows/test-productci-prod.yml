name: Test Product CI (Prod)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v5

      - name: Khởi động MongoDB + API và chờ healthcheck
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Trạng thái container
        run: docker compose ps

      - name: Test CRUD (kiểm tra mã trạng thái)
        run: |
          set -e
          BASE=http://localhost:3000
          J='Content-Type: application/json'

          # check <mã mong đợi> <tham số curl...>
          check() {
            expected=$1; shift
            code=$(curl -s -o /tmp/body -w "%{http_code}" "$@")
            echo "[$code] $(cat /tmp/body)"
            if [ "$code" != "$expected" ]; then
              echo "❌ Mong đợi $expected nhưng nhận $code"; exit 1
            fi
          }

          check 200 $BASE/health
          check 201 -X POST $BASE/products -H "$J" -d '{"pid":"CI001","pname":"CI Product","price":1000,"quantity":1}'
          check 409 -X POST $BASE/products -H "$J" -d '{"pid":"CI001","pname":"Trung","price":1,"quantity":1}'
          check 400 -X POST $BASE/products -H "$J" -d '{"pid":"CI002"}'
          check 200 $BASE/products
          check 200 $BASE/products/CI001
          check 200 -X PUT $BASE/products/CI001 -H "$J" -d '{"price":2000}'
          check 400 -X PUT $BASE/products/CI001 -H "$J" -d '{"price":"abc"}'
          check 200 -X DELETE $BASE/products/CI001
          check 404 $BASE/products/CI001
          echo "✅ Tất cả test CRUD thành công"

      - name: In log khi lỗi
        if: failure()
        run: docker compose logs

      - name: Dọn dẹp
        if: always()
        run: docker compose down -v